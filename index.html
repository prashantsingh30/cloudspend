<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudSpend — Smart Expense Management & Budget Tracking</title>
    <meta name="description" content="Take control of your money, one expense at a time. Record expenses, manage monthly budgets, analyze financial habits, and generate PDF expense reports." />
    <meta property="og:title" content="CloudSpend — Smart Expense Management & Budget Tracking" />
    <meta property="og:description" content="Take control of your money, one expense at a time. Record expenses, manage monthly budgets, analyze financial habits, and generate PDF expense reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Plus Jakarta Sans (Headings/UI) & Inter (Body/Descriptions) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Anti-flash inline theme loader -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cloudspend_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F8FC] text-[#151A2D] dark:bg-[#0B1020] dark:text-[#F4F6FF] font-sans antialiased selection:bg-[#5145E5] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
